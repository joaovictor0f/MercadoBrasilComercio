<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MercadoBrasilComercio</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

header{
background:#0057ff;
color:white;
text-align:center;
padding:25px;
font-size:28px;
font-weight:bold;
}

.banner{
width:100%;
height:220px;
object-fit:cover;
display:block;
}

.produtos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
padding:25px;
}

.card{
background:white;
border-radius:20px;
padding:20px;
text-align:center;
box-shadow:0 0 15px rgba(0,0,0,0.1);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:15px;
}

.preco{
color:red;
font-size:26px;
font-weight:bold;
margin:20px 0;
}

.botao{
background:green;
color:white;
padding:15px 25px;
border-radius:12px;
display:inline-block;
text-decoration:none;
font-size:22px;
font-weight:bold;
}

footer{
background:#0057ff;
color:white;
text-align:center;
padding:25px;
font-size:22px;
margin-top:30px;
}

</style>
</head>

<body>

<header>
MercadoBrasilComercio
</header>

<img class="banner" src="file_000000008d9471f59411d2a3cc730..." alt="Banner">

<section class="produtos">

<div class="card">
<img src="file_00000000db34720eb074fbaaa5628..." alt="">
<div class="preco">50% OFF</div>
<a class="botao" href="#">Comprar Agora</a>
</div>

<div class="card">
<img src="file_000000009b24720ebb0de2160b07a..." alt="">
<div class="preco">OFERTA ESPECIAL</div>
<a class="botao" href="#">Comprar Agora</a>
</div>

</section>

<footer>
Frete Grátis em Todos os Pedidos
</footer>

</body>
</html>
