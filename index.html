<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MercadoBrasilComercio</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f5f5f5;
}

header{
background:#0057ff;
padding:20px;
text-align:center;
color:white;
font-size:32px;
font-weight:bold;
}

.banner{
width:100%;
}

.produtos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:15px;
padding:15px;
text-align:center;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.card img{
width:100%;
border-radius:10px;
}

.preco{
color:red;
font-size:30px;
font-weight:bold;
margin:10px 0;
}

.botao{
background:green;
color:white;
padding:12px 20px;
border-radius:10px;
display:inline-block;
text-decoration:none;
font-weight:bold;
}

footer{
background:#0057ff;
color:white;
text-align:center;
padding:20px;
margin-top:30px;
}
</style>
</head>

<body>

<header>
MercadoBrasilComercio
</header>

<img class="banner" src="file_000000008d9471f59411d2a3cc..." alt="Promoção">

<section class="produtos">

<div class="card">
<img src="file_00000000db34720eb074fbaa5..." alt="">
<div class="preco">50% OFF</div>
<a class="botao" href="#">Comprar Agora</a>
</div>

<div class="card">
<img src="file_000000009b24720ebb0de2160b..." alt="">
<div class="preco">OFERTA ESPECIAL</div>
<a class="botao" href="#">Comprar Agora</a>
</div>

</section>

<footer>
Frete Grátis em Todos os Pedidos
</footer>

</body>
</html>
