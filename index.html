<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MercadoBrasilComercio</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

header{
background:#0057ff;
color:white;
padding:25px;
text-align:center;
font-size:40px;
font-weight:bold;
}

.banner{
width:100%;
display:block;
}

.produtos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:20px;
padding:20px;
text-align:center;
box-shadow:0 0 15px rgba(0,0,0,0.1);
}

.card img{
width:100%;
border-radius:15px;
}

.preco{
color:red;
font-size:45px;
font-weight:bold;
margin:20px 0;
}

.botao{
display:inline-block;
background:green;
color:white;
padding:15px 30px;
border-radius:12px;
text-decoration:none;
font-size:25px;
font-weight:bold;
}

footer{
background:#0057ff;
color:white;
text-align:center;
padding:25px;
font-size:25px;
margin-top:30px;
}

</style>
</head>

<body>

<header>
MercadoBrasilComercio
</header>

<img class="banner" src="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?q=80&w=1200&auto=format&fit=crop" alt="Banner">

<section class="produtos">

<div class="card">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=1000&auto=format&fit=crop">

<div class="preco">
50% OFF
</div>

<a class="botao" href="#">
Comprar Agora
</a>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=1000&auto=format&fit=crop">

<div class="preco">
OFERTA ESPECIAL
</div>

<a class="botao" href="#">
Comprar Agora
</a>

</div>

</section>

<footer>
Frete Grátis em Todos os Pedidos
</footer>

</body>
</html>
